<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clear Reply Settings</title>
    <link rel="stylesheet" href="app.css">
  </head>
  <body class="options">
    <h1>Clear Reply</h1>
    <label for="api-key">Groq API key</label>
    <input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="gsk_…">
    <p class="hint">Create a key at <a href="https://console.groq.com/keys" target="_blank" rel="noreferrer">console.groq.com/keys</a>. It stays on this computer.</p>
    <label for="model">Model</label>
    <input id="model" list="model-list" spellcheck="false" placeholder="qwen/qwen3.8-27b">
    <datalist id="model-list"></datalist>
    <label for="system-prompt">System prompt</label>
    <textarea id="system-prompt" rows="10" spellcheck="true"></textarea>
    <div class="row">
      <button type="button" id="refresh-models" class="ghost">Refresh models</button>
      <button type="button" id="save-settings" class="primary">Save</button>
    </div>
    <p id="settings-status" role="status"></p>
    <script src="options.js"></script>
  </body>
</html>
