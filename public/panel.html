<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clear Reply</title>
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <header>
      <h1>Clear Reply</h1>
      <button type="button" id="settings-btn" class="ghost icon">Settings</button>
    </header>

    <section id="setup" hidden>
      <p>Add a Groq API key to rewrite replies.</p>
      <button type="button" id="open-settings" class="primary">Open Settings</button>
    </section>

    <label for="draft">Your draft</label>
    <textarea id="draft" rows="8" placeholder="Paste the reply you want to send…"></textarea>

    <div class="row">
      <button type="button" id="paste" class="ghost">Paste</button>
      <button type="button" id="rewrite" class="primary"><span id="rewrite-label">Rewrite</span> <kbd id="rewrite-hint">⌘↵</kbd></button>
    </div>

    <label for="result">Clear English</label>
    <textarea id="result" rows="8" placeholder="Rewritten reply appears here"></textarea>

    <button type="button" id="copy" class="primary" disabled>Copy</button>

    <p id="status" role="status"></p>

    <dialog id="settings">
      <h2>Settings</h2>
      <label for="api-key">Groq API key</label>
      <input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="gsk_…">
      <p class="hint">Create a key at <a href="https://console.groq.com/keys" target="_blank" rel="noreferrer">console.groq.com/keys</a>. It stays on this computer.</p>
      <label for="model">Model</label>
      <input id="model" list="model-list" spellcheck="false" placeholder="qwen/qwen3.8-27b">
      <datalist id="model-list"></datalist>
      <label for="system-prompt">System prompt</label>
      <textarea id="system-prompt" rows="10" spellcheck="true"></textarea>
      <div class="row">
        <button type="button" id="refresh-models" class="ghost">Refresh models</button>
        <button type="button" id="save-settings" class="primary">Save</button>
      </div>
      <p id="settings-status" role="status"></p>
    </dialog>

    <script src="panel.js"></script>
  </body>
</html>
